<script>
// The renderer sets window.__SPEC__ before calling boot().
window.boot = function (spec) {
  if (spec.meta && spec.meta.theme) document.documentElement.dataset.theme = spec.meta.theme;
  E.build(spec);
  window.renderFrame(0);
  return window.reelDuration;
};
</script>
